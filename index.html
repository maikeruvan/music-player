<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <script src="https://kit.fontawesome.com/93a8b4ff29.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="main.css">
    <script type="module" src="main.js"></script>
</head>
<body>
    <div class="player">
        <!-- Player Header -->
        <div class="player__header">
            <button type="button" class="header__library">
                <i class="fa-solid fa-angle-left"></i>
            </button>
            <button type="button" class="header__menu">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
        <!-- Player Header End -->
        <!-- Player Details -->
        <div class="player__details">
            <a href="#" class="details__cover">
                <img src="images/cover-image.jpg" alt="Track Cover Image" class="cover__image">
            </a>
            <p class="details__title"></p>
            <p class="details__artist"></p>
        </div>
        <!-- Player Details End -->
        <!-- Player Control -->
        <div class="player__control">
            <div class="control__progress">
                <span class="progress__current-time">00:00</span>
                <input type="range" value="0" class="progress__slider">
                <span class="progress__duration">00:00</span>
            </div>
            <div class="control__buttons">
                <button type="button" class="buttons__shuffle">
                    <i class="fa-solid fa-shuffle"></i>
                </button>
                <button type="button" class="buttons__previous-track">
                    <i class="fa-solid fa-angles-left"></i>
                </button>
                <button type="button" class="buttons__play-pause">
                    <i class="fa-solid fa-play fa-2x"></i>
                </button>
                <button type="button" class="buttons__next-track">
                    <i class="fa-solid fa-angles-right"></i>
                </button>
                <button type="button" class="buttons__replay">
                    <i class="fa-solid fa-arrow-rotate-right"></i>
                </button>
            </div>
            <div class="control__volume">
                <button type="button" class="volume__down">
                    <i class="fa-solid fa-volume-low"></i>
                </button>
                <input type="range" min="0" max="1" step="0.1" value="0.5" class="volume__slider">
                <span class="volume__percentage">50%</span>
                <button type="button" class="volume__up">
                    <i class="fa-solid fa-volume-high"></i>
                </button>
            </div>
        </div>
        <!-- Player Control End -->
    </div>
</body>
</html>
